<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="background" class="background" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main class="layout">
    <!-- top-left / top-right slots: filled in later milestones (links, weather) -->
    <header class="top-row">
      <div id="top-left">
        <!-- Pomodoro timer -->
        <section id="pomodoro" class="pomodoro panel" aria-label="Pomodoro timer">
          <div class="pomo-ring">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <circle class="pomo-ring-track" cx="32" cy="32" r="28"></circle>
              <circle id="pomo-ring-progress" class="pomo-ring-progress" cx="32" cy="32" r="28"></circle>
            </svg>
            <span id="pomo-time" class="pomo-time" role="timer">25:00</span>
          </div>
          <div class="pomo-side">
            <span id="pomo-label" class="pomo-label">Focus</span>
            <span id="pomo-round" class="pomo-round">Round 1 of 4</span>
            <div class="pomo-controls">
              <button id="pomo-toggle" class="pill-button" type="button">Start</button>
              <button id="pomo-reset" class="small-button" type="button" title="Restart this phase" aria-label="Restart this phase">↺</button>
              <button id="pomo-skip" class="small-button" type="button" title="Skip to next phase" aria-label="Skip to next phase">⏭︎</button>
            </div>
          </div>
        </section>
      </div>
      <div id="top-right">
        <!-- Weather (Open-Meteo) -->
        <section id="weather" class="weather" aria-label="Current weather" hidden>
          <p class="weather-main">
            <span id="weather-icon" class="weather-icon" aria-hidden="true"></span>
            <span id="weather-temp" class="weather-temp"></span>
          </p>
          <p class="weather-sub">
            <span id="weather-city" class="weather-city" title="Click to change city"></span>
            <span id="weather-desc" class="weather-desc"></span>
          </p>
        </section>
      </div>
    </header>

    <section class="center">
      <!-- First-run: ask for the user's name -->
      <form id="name-prompt" class="name-prompt" hidden>
        <label for="name-input">Hello, what's your name?</label>
        <input id="name-input" type="text" autocomplete="off" maxlength="40" spellcheck="false">
      </form>

      <!-- Main view: clock + greeting -->
      <div id="clock-view" hidden>
        <time id="clock" class="clock"></time>
        <p class="greeting">
          <span id="greeting-text"></span><span id="greeting-name" class="greeting-name" title="Double-click to change your name"></span>.
        </p>

        <!-- Daily focus + streak -->
        <section id="focus" class="focus" aria-label="Main focus for today">
          <form id="focus-form" class="focus-form" hidden>
            <label for="focus-input">What is your main focus for today?</label>
            <input id="focus-input" class="line-input" type="text" autocomplete="off" maxlength="80">
          </form>

          <div id="focus-view" class="focus-view" hidden>
            <p class="focus-heading">
              <span>Today</span>
              <span id="streak" class="streak" hidden></span>
              <span id="pomo-count" class="pomo-count" title="Focus rounds completed today" hidden></span>
            </p>
            <div class="focus-row">
              <input id="focus-done" type="checkbox" class="focus-check" aria-label="Mark focus as done">
              <span id="focus-text" class="focus-text"></span>
              <button id="focus-remove" class="icon-button" type="button" aria-label="Clear focus" title="Clear focus">×</button>
            </div>
            <p id="focus-praise" class="focus-praise" aria-live="polite"></p>
          </div>
        </section>
      </div>
    </section>

    <footer class="bottom-row">
      <div id="bottom-left">
        <p id="photo-credit" class="photo-credit" hidden></p>
      </div>
      <div id="bottom-center">
        <!-- Quote of the day (author appears on hover) -->
        <figure id="quote" class="quote" hidden>
          <blockquote id="quote-text" class="quote-text"></blockquote>
          <figcaption id="quote-author" class="quote-author"></figcaption>
        </figure>
      </div>
      <div id="bottom-right">
        <!-- Settings -->
        <button id="settings-toggle" class="corner-button" type="button" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="settings-panel">
          <span class="gear" aria-hidden="true">⚙︎</span>
        </button>

        <!-- To-dos -->
        <button id="todo-toggle" class="corner-button todo-toggle" type="button" aria-expanded="false" aria-controls="todo-panel">
          Todo <span id="todo-count" class="todo-count" hidden></span>
        </button>

        <section id="todo-panel" class="popover panel todo-panel" aria-label="To-do list" hidden>
          <h2 class="popover-title">Today's to-dos</h2>
          <ul id="todo-list" class="todo-list"></ul>
          <p id="todo-empty" class="todo-empty">Nothing here yet. Add your first to-do below.</p>
          <form id="todo-form">
            <input id="todo-input" class="todo-input" type="text" placeholder="New to-do" autocomplete="off" maxlength="120">
          </form>
          <button id="todo-clear" class="text-button" type="button" hidden>Clear completed</button>
        </section>

        <section id="settings-panel" class="popover panel settings-panel" aria-label="Settings" hidden>
          <h2 class="popover-title">Settings</h2>
          <form id="settings-form" class="settings-form">
            <fieldset>
              <legend>General</legend>
              <label class="row">Name <input name="name" type="text" maxlength="40" autocomplete="off"></label>
              <label class="row">City (weather) <input name="city" type="text" maxlength="60" autocomplete="off"></label>
              <label class="row">24-hour clock <input name="use24h" type="checkbox" class="switch"></label>
            </fieldset>
            <fieldset>
              <legend>Show</legend>
              <label class="row">Pomodoro timer <input name="show-pomodoro" type="checkbox" class="switch"></label>
              <label class="row">Weather <input name="show-weather" type="checkbox" class="switch"></label>
              <label class="row">Quote <input name="show-quote" type="checkbox" class="switch"></label>
              <label class="row">To-dos <input name="show-todos" type="checkbox" class="switch"></label>
            </fieldset>
            <fieldset>
              <legend>Pomodoro (minutes)</legend>
              <label class="row">Focus <input name="duration-focus" type="number" min="1" max="180"></label>
              <label class="row">Short break <input name="duration-short" type="number" min="1" max="180"></label>
              <label class="row">Long break <input name="duration-long" type="number" min="1" max="180"></label>
            </fieldset>
          </form>
          <button id="settings-reset" class="text-button danger" type="button">Reset all data</button>
        </section>
      </div>
    </footer>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
